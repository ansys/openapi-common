# check spelling, codestyle
name: Build and Test Package

# run only on main branch.  This avoids duplicated actions on PRs
on:
  pull_request:
  merge_group:
  push:
    tags:
      - "*"
    branches:
      - main

env:
  MAIN_PYTHON_VERSION: '3.13'
  LIBRARY_NAME: 'ansys-openapi-common'
  DOCUMENTATION_CNAME: 'openapi.docs.pyansys.com'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: "Code style"
    runs-on: windows-latest
    steps:
      - uses: ansys/actions/code-style@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
         python-version: ${{ env.MAIN_PYTHON_VERSION }}
         skip-install: "false"

      - name: Type check library
        run:
          uv run --frozen mypy ./src

  doc-style:
    name: Documentation Style Check
    runs-on: ubuntu-latest
    steps:
      - name: PyAnsys documentation style checks
        uses: ansys/actions/doc-style@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-changelogd: true

  doc-build:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: "Run Ansys documentation building action"
        uses: ansys/actions/doc-build@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          check-links: false
          sphinxopts: "-W --keep-going"
          optional-dependencies-name: ''
          group-dependencies-name: 'doc'

  build-wheelhouse:
    name: "Build wheelhouse for latest Python versions"
    runs-on: ${{ matrix.os }}
    needs: code-style
    permissions:
      id-token: write  # Required for Sigstore
      attestations: write  # Required to generate attestation
    strategy:
       matrix:
           os: [ubuntu-latest, windows-latest]
           python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: ansys/actions/build-wheelhouse@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          attest-provenance: true

  tests:
    name: Unit test on supported platforms (${{ fromJson(matrix.image).name }})
    runs-on: ubuntu-latest
    needs: build-wheelhouse
    permissions:
      contents: read
      packages: read  # to allow the Action to pull from GitHub Packages container registry - required for kdc-server
    services:
      # Label used to access the service container
      kdc-server:
        # Github container registry address
        image: ghcr.io/ansys/kdc-container@sha256:af669430229c13a35f106b531868fb8bd7c53731b8de858b1fe9b21a62ae747d  # v0.2
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        volumes:
          # This is needed otherwise there won't be enough entropy to generate a new kerberos realm
          - /dev/urandom:/dev/random
          - /tmp/keytabs:/tmp/keytabs
        ports:
          - 749:749
          - 88:88/udp

    container:
      image: python@sha256:${{ fromJson(matrix.image).hash }}  # official python images from DockerHub
      volumes:
        - /tmp/keytabs:/tmp/keytabs
    strategy:
      matrix:
        image:
          - '{"name": "3.12", "hash": "0d0db5b17f11b1b7d1aafa74ceadaa64ba0944b267ff6fc22008a197acd6b9ad"}'  # 3.12.15 - trixie
          - '{"name": "3.13", "hash": "bf756c962c5d29f6fe30dbf70c692b1e978c272619e8f1096e1d697934c662bf"}'  # 3.13.17 - trixie
          - '{"name": "3.14", "hash": "2c90493710bd462e097441e60b0218430d8f7e2b46779bfca3742b2efd386feb"}'  # 3.14.9 - trixie

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Configure host kerberos
      run: |
        apt update
        export DEBIAN_FRONTEND=noninteractive
        apt install -yq krb5-user
        cp ./tests/integration/krb5.conf /etc/krb5.conf
        ./tests/integration/configure_keytab.sh

    - name: Test
      run: >
        uv run --frozen
        --python ${{ fromJson(matrix.image).name }}
        --extra oidc --extra linux-kerberos --group dev-linux
        --
        pytest
        --cov=ansys.openapi.common
        --cov-report=xml
        --with-kerberos

    - name: Upload coverage report
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      if: ${{ github.actor != 'dependabot[bot]' }}
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  build-library:
    name: "Build library"
    runs-on: ubuntu-latest
    needs: [ doc-build, tests ]
    permissions:
      id-token: write  # Required for Sigstore
      attestations: write  # Required to generate attestation
    steps:
      - uses: ansys/actions/build-library@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          attest-provenance: true

  doc-deploy-dev:
    name: "Deploy development documentation"
    runs-on: ubuntu-latest
    needs: [ build-library ]
    if: github.event_name == 'push' && !contains(github.ref, 'refs/tags')
    permissions:
      contents: write  # to allow the Action to push to the gh-pages branch
    steps:
      - uses: ansys/actions/doc-deploy-dev@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          doc-artifact-name: documentation-html
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  update-changelog:
    name: "Update CHANGELOG for new tag"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to allow the Action to push to the repo
      pull-requests: write  # to allow the Action to create a PR if needed
    steps:
      - uses: ansys/actions/doc-deploy-changelog@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: "Release"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [build-library, update-changelog]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for trusted publisher auth to PyPI
      contents: write  # to allow the Action to upload a release asset
    steps:
    - name: "Download the library artifacts from build-library step"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ env.LIBRARY_NAME }}-artifacts
        path: ${{ env.LIBRARY_NAME }}-artifacts

    - name: "Upload artifacts to PyPI using trusted publisher"
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: "https://upload.pypi.org/legacy/"
        print-hash: true
        packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
        skip-existing: false

    - uses: ansys/actions/release-github@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
      name: "Release to GitHub"
      with:
        library-name: ${{ env.LIBRARY_NAME }}
        token: ${{ secrets.GITHUB_TOKEN }}

  doc-deploy-stable:
    name: "Deploy stable documentation"
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    permissions:
      contents: write  # to allow the Action to push to the gh-pages branch
    steps:
      - uses: ansys/actions/doc-deploy-stable@a5c8d0d92928e144130a3c64aa7200b9547785de  # v11.1.3
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
